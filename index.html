<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Từ điển Toán 8 – Anh/Việt</title>
<style>
:root{
  --bg:#f5f6fb;--card:#ffffff;--ink:#141a2e;--muted:#6b7390;--line:#e7e9f3;
  --brand:#4f46e5;--brand2:#7c3aed;--soft:#eef0ff;--acc:#f59e0b;
  --shadow:0 1px 2px rgba(20,26,46,.05),0 6px 20px -8px rgba(20,26,46,.12);
  --r:18px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1120;--card:#171b2e;--ink:#eef0fa;--muted:#9aa2c0;--line:#262b45;--soft:#22264a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.big{font-size:20px}
button{font:inherit;cursor:pointer;color:inherit}
svg{display:block}

/* Header */
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  padding:14px 16px 16px;padding-top:calc(14px + env(safe-area-inset-top));border-radius:0 0 24px 24px;box-shadow:0 10px 30px -14px rgba(79,70,229,.7)}
.top{display:flex;align-items:center;gap:12px;max-width:900px;margin:0 auto}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:1.3em;flex:0 0 auto}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:1.08em;margin:0;font-weight:800;letter-spacing:-.01em}
.ttl p{margin:0;font-size:.78em;opacity:.82}
.iconbtn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:12px;height:40px;min-width:44px;padding:0 10px;font-weight:800;font-size:.9em}
.iconbtn:active{transform:scale(.95)}
.search{margin:14px auto 0;position:relative;max-width:900px}
.search .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8a8fb0;pointer-events:none}
.search input{width:100%;border:0;border-radius:16px;padding:14px 46px 14px 44px;font-size:1em;outline:none;background:#fff;color:#141a2e;box-shadow:0 4px 14px -6px rgba(0,0,0,.25)}
.search input::placeholder{color:#9aa0bd}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#eef0f7;color:#555b78;width:30px;height:30px;border-radius:50%;display:none;font-size:1.1em;line-height:1}

/* Topic chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none;position:sticky;z-index:4;background:var(--bg);max-width:900px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px 8px 10px;font-size:.88em;color:var(--muted);font-weight:650;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:.15s}
.chip .e{font-size:1.05em}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

main{padding:4px 14px calc(100px + env(safe-area-inset-bottom));max-width:900px;margin:0 auto}
.count{font-size:.82em;color:var(--muted);margin:2px 4px 6px}
.group{display:flex;align-items:center;gap:10px;margin:20px 4px 10px;font-weight:800;font-size:.95em}
.group .gi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:1.05em;background:color-mix(in srgb,var(--c) 16%,transparent)}
.group .gn{margin-left:auto;font-size:.78em;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:2px 9px;border-radius:999px}
.list{display:grid;gap:10px}
@media (min-width:760px){.list{grid-template-columns:1fr 1fr}}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--brand))}
.row{display:flex;align-items:flex-start;gap:6px}
.en{font-weight:800;font-size:1.1em;flex:1;letter-spacing:-.01em;word-break:break-word}
.vi{color:var(--muted);margin-top:2px;font-weight:500}
.ex{margin-top:10px;padding:9px 12px;background:var(--soft);border-radius:12px;font-size:.92em}
.ex .v{color:var(--muted);font-size:.95em;margin-top:2px}
.act{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;margin-top:-6px}
.act:active{background:var(--soft)}
.star.on{color:var(--acc)}
.star.on svg{fill:currentColor}
.sent .en{font-weight:700;font-size:1.03em}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty .big{font-size:2.4em;margin-bottom:6px}
mark{background:#fde68a;color:#141a2e;padding:0 2px;border-radius:4px}

/* Bottom nav */
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;display:flex;padding:6px;z-index:6;box-shadow:0 12px 30px -12px rgba(20,26,46,.35)}
nav button{flex:1;border:0;background:none;padding:7px 2px 6px;font-size:.74em;color:var(--muted);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:16px;transition:.15s}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--brand);background:var(--soft)}
.panel{display:none}.panel.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* AI */
.ai .card::before{display:none}
.ai h2{margin:0;font-size:1.1em}
.ai textarea,.ai input{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;background:var(--bg);color:var(--ink);outline:none}
.ai textarea:focus,.ai input:focus{border-color:var(--brand)}
.ai textarea{min-height:96px;resize:vertical}
.btn{border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:14px;padding:13px 16px;font-weight:800;width:100%;margin-top:12px}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--soft);color:var(--brand)}
.note{font-size:.85em;color:var(--muted)}
.answer{white-space:pre-wrap;word-wrap:break-word}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.82em;color:var(--muted);text-align:left}
details summary{cursor:pointer;font-weight:800;list-style:none}
details summary::-webkit-details-marker{display:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88em;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">📐</div>
    <div class="ttl"><h1>Từ điển Toán 8</h1><p>Anh – Việt · dành cho giáo viên</p></div>
    <button class="iconbtn" id="sizeBtn" title="Phóng to chữ">A+</button>
  </div>
  <div class="search">
    <svg class="si" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="text" enterkeyhint="search" placeholder="Tìm tiếng Việt hoặc tiếng Anh…" autocomplete="off">
    <button class="clear" id="clr" aria-label="Xóa">×</button>
  </div>
</header>

<div class="chips" id="chips"></div>

<main>
  <section class="panel on" id="p-words"><div class="count" id="cw"></div><div id="words"></div></section>
  <section class="panel" id="p-sents"><div class="count" id="cs"></div><div id="sents"></div></section>
  <section class="panel" id="p-fav"><div id="favs"></div></section>
  <section class="panel ai" id="p-ai">
    <div class="card">
      <h2>✨ Hỏi AI (Gemini)</h2>
      <div class="note" style="margin-top:4px">Dùng khi cần từ/câu không có sẵn trong app. Phần Từ vựng và Mẫu câu luôn dùng được mà không cần mạng hay API.</div>
      <textarea id="aiQ" style="margin-top:10px" placeholder="VD: Nói 'Hãy chứng minh tứ giác ABCD là hình bình hành' bằng tiếng Anh thế nào?"></textarea>
      <div class="quick" id="quick"></div>
      <button class="btn" id="aiGo">Hỏi Gemini</button>
    </div>
    <div class="card" id="aiOut" style="display:none"><div class="answer" id="aiAns"></div></div>
    <div class="card">
      <details id="keyBox">
        <summary>⚙️ Cài đặt API key</summary>
        <div class="note" style="margin:8px 0">Lấy key miễn phí tại aistudio.google.com → “Get API key”. Key chỉ lưu trên máy này.</div>
        <input id="key" type="password" placeholder="Dán Gemini API key">
        <input id="model" style="margin-top:8px" placeholder="Model" value="gemini-2.5-flash">
        <button class="btn ghost" id="saveKey">Lưu</button>
      </details>
    </div>
  </section>
</main>

<nav>
  <button class="on" data-p="words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6M9 11h4"/></svg>Từ vựng</button>
  <button data-p="sents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Mẫu câu</button>
  <button data-p="fav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>Đã lưu</button>
  <button data-p="ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></svg>Hỏi AI</button>
</nav>

const $ = s => document.querySelector(s);
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let favs = new Set(LS.get("tdt8_favs",[]));
let panel = "words", cat = "Tất cả", q = "";

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(text){
  const t = esc(text); if(!q) return t;
  const nt = norm(text), nq = norm(q.trim()); if(!nq) return t;
  const i = nt.indexOf(nq); if(i<0) return t;
  // norm() giữ nguyên độ dài cho chữ tiếng Việt dựng sẵn
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+nq.length))+"</mark>"+esc(text.slice(i+nq.length));
}
const META = {
 "Tất cả":["✨","#4f46e5"],
 "Đa thức":["🧮","#6366f1"],"Hằng đẳng thức":["⚖️","#8b5cf6"],"Phân thức":["➗","#ec4899"],
 "Phương trình":["🎯","#ef4444"],"Hàm số & đồ thị":["📈","#0ea5e9"],"Tứ giác":["🔷","#14b8a6"],
 "Định lí Thalès & tam giác":["📐","#f59e0b"],"Hình chóp":["🔺","#f97316"],"Thống kê & xác suất":["📊","#22c55e"],
 "Bắt đầu – kết thúc giờ học":["👋","#6366f1"],"Ra yêu cầu – chỉ dẫn":["📋","#0ea5e9"],"Hỏi – đáp trong giờ Toán":["💬","#14b8a6"],
 "Khen ngợi – động viên":["👏","#f59e0b"],"Cách đọc biểu thức – kí hiệu":["🔤","#8b5cf6"],"Câu trong đề bài – lời giải":["📝","#ef4444"]
};
const M = c => META[c] || ["•","#4f46e5"];
const ICO_COPY = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const ICO_STAR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>';
const actions = (copy,id) => `<button class="act" data-copy="${esc(copy)}" title="Chép">${ICO_COPY}</button><button class="act star ${favs.has(id)?"on":""}" data-fav="${esc(id)}" title="Lưu">${ICO_STAR}</button>`;
const idW = (c,w)=>"w|"+w[0]+"|"+w[1];
const idS = (c,s)=>"s|"+s[0];

function chips(){
  const src = panel==="sents"?SENTS:WORDS;
  const names = ["Tất cả",...Object.keys(src)];
  if(!names.includes(cat)) cat="Tất cả";
  $("#chips").style.display = (panel==="words"||panel==="sents")?"flex":"none";
  $("#chips").innerHTML = names.map(n=>`<button class="chip ${n===cat?"on":""}" data-c="${esc(n)}"><span class="e">${M(n)[0]}</span>${esc(n)}</button>`).join("");
}
function match(arr){ if(!q.trim()) return true; const nq=norm(q.trim()); return arr.some(x=>norm(x).includes(nq)); }

function wordCard(c,w){
  const id=idW(c,w);
  return `<div class="card" style="--c:${M(c)[1]}"><div class="row"><div class="en">${hl(w[0])}</div>${actions(w[0],id)}</div>
  <div class="vi">${hl(w[1])}</div>
  ${w[2]?`<div class="ex">${hl(w[2])}<div class="v">${hl(w[3]||"")}</div></div>`:""}</div>`;
}
function sentCard(c,s){
  const id=idS(c,s);
  return `<div class="card sent" style="--c:${M(c)[1]}"><div class="row"><div class="en">${hl(s[0])}</div>${actions(s[0],id)}</div>
  <div class="vi">${hl(s[1])}</div></div>`;
}
function renderList(src, el, countEl, card, unit){
  let html="", n=0;
  for(const c of Object.keys(src)){
    if(cat!=="Tất cả" && c!==cat) continue;
    const items = src[c].filter(match);
    if(!items.length) continue;
    n+=items.length;
    html += `<div class="group" style="--c:${M(c)[1]}"><span class="gi">${M(c)[0]}</span>${esc(c)}<span class="gn">${items.length}</span></div><div class="list">` + items.map(x=>card(c,x)).join("") + `</div>`;
  }
  el.innerHTML = html || `<div class="empty"><div class="big">🔍</div>Không tìm thấy “${esc(q)}”.<br><button class="btn ghost" style="width:auto;padding:10px 18px" data-ask="1">✨ Hỏi AI về từ này</button></div>`;
  countEl.textContent = n ? `${n} ${unit}` : "";
}
function renderFav(){
  let html="";
  for(const c in WORDS) for(const w of WORDS[c]) if(favs.has(idW(c,w)) && match(w)) html+=wordCard(c,w);
  for(const c in SENTS) for(const s of SENTS[c]) if(favs.has(idS(c,s)) && match(s)) html+=sentCard(c,s);
  $("#favs").innerHTML = html ? `<div class="list" style="margin-top:12px">${html}</div>` : `<div class="empty"><div class="big">⭐</div>Chưa lưu mục nào.<br>Bấm ☆ ở từ hoặc câu để lưu, dùng nhanh khi dạy.</div>`;
}
function render(){
  chips();
  if(panel==="words") renderList(WORDS,$("#words"),$("#cw"),wordCard,"từ");
  else if(panel==="sents") renderList(SENTS,$("#sents"),$("#cs"),sentCard,"câu");
  else if(panel==="fav") renderFav();
  $("#q").parentElement.style.display = panel==="ai"?"none":"block";
}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1400)}
function go(p){
  panel=p; document.querySelectorAll(".panel").forEach(x=>x.classList.toggle("on",x.id==="p-"+p));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));
  render(); window.scrollTo(0,0);
}

$("#q").addEventListener("input",e=>{q=e.target.value;$("#clr").style.display=q?"block":"none";render()});
$("#clr").onclick=()=>{q="";$("#q").value="";$("#clr").style.display="none";render();$("#q").focus()};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.p));
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-c],[data-fav],[data-copy],[data-ask]"); if(!t) return;
  if(t.dataset.c){cat=t.dataset.c;render();}
  else if(t.dataset.fav){const id=t.dataset.fav; favs.has(id)?favs.delete(id):favs.add(id); LS.set("tdt8_favs",[...favs]); t.classList.toggle("on"); if(panel==="fav")renderFav(); toast(favs.has(id)?"Đã lưu ★":"Đã bỏ lưu");}
  else if(t.dataset.copy){const s=t.dataset.copy; (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast("Đã chép"),()=>{const a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Đã chép")}catch(_){}a.remove()});}
  else if(t.dataset.ask){$("#aiQ").value=`Dịch sang tiếng Anh (Toán 8): "${q}"`;go("ai");}
});

$("#quick").onclick=e=>{if(e.target.tagName==="BUTTON")$("#aiQ").value=e.target.textContent};

$("#aiGo").onclick=async()=>{
  const key=LS.get("tdt8_key",""), model=LS.get("tdt8_model","gemini-2.5-flash"), ask=$("#aiQ").value.trim();
  if(!ask){toast("Nhập câu hỏi trước");return}
  if(!key){$("#keyBox").open=true;toast("Cần nhập API key");return}
  $("#aiOut").style.display="block"; $("#aiAns").textContent="Đang hỏi Gemini…"; $("#aiGo").disabled=true;
  const sys="Bạn là trợ lý tiếng Anh cho giáo viên Toán lớp 8 ở Việt Nam. Trả lời ngắn gọn, dễ dùng trong lớp, bằng tiếng Việt kèm tiếng Anh. Với từ: nêu từ tiếng Anh, nghĩa, 1 câu ví dụ đơn giản (EN + VI). Với câu: đưa bản dịch tiếng Anh đơn giản, chuẩn thuật ngữ toán, có thể thêm 1 cách nói khác. Không dùng bảng, không dùng LaTeX; viết kí hiệu toán thường (x², √, ∥, ⊥).";
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
      method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},
      body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:"user",parts:[{text:ask}]}]})
    });
    const j=await r.json();
    if(!r.ok) throw new Error(j.error&&j.error.message||("Lỗi "+r.status));
    const txt=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.text||"").join("").trim();
    $("#aiAns").innerHTML = esc(txt||"(Không có câu trả lời)").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^\s*[\*\-] /gm,"• ");
  }catch(err){
    $("#aiAns").textContent="Không gọi được Gemini: "+err.message+"\n\nKiểm tra: có mạng không, API key đúng chưa, tên model còn dùng được không.";
  }finally{$("#aiGo").disabled=false}
};

render();
</script>
</body>
</html>
